<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img">
<title>PX-07 — floating TV-head buddy</title>
<defs>
  <filter id="g2" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .mono{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}
  .flt{animation:flt 3.4s ease-in-out infinite alternate}
  @keyframes flt{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
  .shd{transform-box:fill-box;transform-origin:center;animation:shd 3.4s ease-in-out infinite alternate}
  @keyframes shd{from{transform:scaleX(1);opacity:.35}to{transform:scaleX(.72);opacity:.18}}
  .eyesA{animation:ba 4.2s steps(1,end) infinite}
  @keyframes ba{0%,88%,95%,100%{opacity:1}89%,94%{opacity:0}}
  .eyesB{animation:bb 4.2s steps(1,end) infinite}
  @keyframes bb{0%,88%,95%,100%{opacity:0}89%,94%{opacity:1}}
  .stx{animation:st .8s steps(3,end) infinite}
  @keyframes st{0%,100%{opacity:.05}50%{opacity:.16}}
  .pulse{animation:pu 1.6s ease-in-out infinite}
  @keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
  .s1{animation:sg 2.2s ease-out infinite}
  .s2{animation:sg 2.2s ease-out infinite;animation-delay:.4s}
  @keyframes sg{0%{opacity:0}25%{opacity:.85}60%,100%{opacity:0}}
</style>

<ellipse cx="150" cy="272" rx="58" ry="9" fill="#000000" class="shd"/>

<g class="flt">
  <!-- antenna -->
  <line x1="150" y1="74" x2="150" y2="42" stroke="#A957FF" stroke-width="3"/>
  <circle cx="150" cy="38" r="5.5" fill="#F72585" filter="url(#g2)" class="pulse"/>
  <path d="M136 30 A20 20 0 0 1 164 30" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" class="s1"/>
  <path d="M128 20 A31 31 0 0 1 172 20" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" class="s2"/>

  <!-- side stubs -->
  <rect x="48" y="118" width="12" height="26" rx="4" fill="#1A0B3D" stroke="#A957FF" stroke-width="2"/>
  <rect x="240" y="118" width="12" height="26" rx="4" fill="#1A0B3D" stroke="#A957FF" stroke-width="2"/>

  <!-- head -->
  <rect x="62" y="74" width="176" height="128" rx="18" fill="#140632" stroke="#A957FF" stroke-width="2.5"/>
  <rect x="76" y="88" width="148" height="100" rx="10" fill="#0A0118" stroke="#00E5FF" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- screen static -->
  <rect x="82" y="102" width="136" height="2.5" fill="#00E5FF" class="stx"/>
  <rect x="82" y="134" width="136" height="2.5" fill="#00E5FF" class="stx" style="animation-delay:-.3s"/>
  <rect x="82" y="168" width="136" height="2.5" fill="#00E5FF" class="stx" style="animation-delay:-.6s"/>

  <!-- eyes open ^ ^ -->
  <g class="eyesA" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="102,138 115,124 128,138"/>
    <polyline points="172,138 185,124 198,138"/>
  </g>
  <!-- eyes closed - - -->
  <g class="eyesB" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="102" y1="132" x2="128" y2="132"/>
    <line x1="172" y1="132" x2="198" y2="132"/>
  </g>

  <!-- cheeks -->
  <rect x="94" y="150" width="14" height="5" rx="2.5" fill="#F72585" opacity=".65"/>
  <rect x="192" y="150" width="14" height="5" rx="2.5" fill="#F72585" opacity=".65"/>

  <!-- torso -->
  <rect x="96" y="202" width="108" height="34" rx="10" fill="#140632" stroke="#A957FF" stroke-width="2"/>
  <circle cx="150" cy="219" r="6" fill="#F9F871" class="pulse" style="animation-delay:-.8s"/>
  <g fill="#F9F871" opacity=".7">
    <rect x="176" y="210" width="4" height="18" transform="skewX(-20)"/>
    <rect x="186" y="210" width="4" height="18" transform="skewX(-20)"/>
  </g>

  <!-- legs -->
  <rect x="116" y="236" width="16" height="24" rx="5" fill="#1A0B3D" stroke="#7B2FF7" stroke-width="2"/>
  <rect x="168" y="236" width="16" height="24" rx="5" fill="#1A0B3D" stroke="#7B2FF7" stroke-width="2"/>

  <!-- unit label -->
  <text x="150" y="196" text-anchor="middle" class="mono" font-size="10" letter-spacing="3" fill="#8B8BA7">PX-07</text>
</g>
</svg>
