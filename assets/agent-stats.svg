<text x="40" y="172" class="mono" font-size="14" fill="#B9B9D4">COMPUTER VISION</text>
<rect x="250" y="160" width="560" height="14" rx="7" fill="#1A0B3D" stroke="#7B2FF7" stroke-opacity=".3"/>
<rect x="250" y="160" width="560" height="14" rx="7" fill="url(#fill)" class="bar b3"/>
<g clip-path="url(#c3)"><rect x="250" y="160" width="70" height="14" fill="url(#sh)" class="shm" style="animation-delay:2.2s"/></g>
<text x="838" y="172" text-anchor="end" class="mono" font-weight="bold" font-size="14" fill="#EDEDF7">88</text>
<rect x="852" y="157" width="40" height="20" rx="4" fill="#00E5FF" class="chip" style="animation-delay:1.49s"/>
<text x="872" y="171" text-anchor="middle" class="sans" font-weight="900" font-size="13" fill="#0D0221"><tspan class="fx" style="animation-delay:1.54s">A</tspan></text>

