<text x="40" y="286" class="mono" font-size="14" fill="#B9B9D4">MLOPS</text>
<rect x="250" y="274" width="560" height="14" rx="7" fill="#1A0B3D" stroke="#7B2FF7" stroke-opacity=".3"/>
