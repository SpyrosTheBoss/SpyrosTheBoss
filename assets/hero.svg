<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img">
<title>Spyros Stavrakis — Data and ML Proxy // New Eridu</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0D0221"/>
    <stop offset=".55" stop-color="#10002B"/>
    <stop offset="1" stop-color="#1A0033"/>
  </linearGradient>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF"/>
    <stop offset=".5" stop-color="#A957FF"/>
    <stop offset="1" stop-color="#F72585"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00E5FF" stop-opacity=".07"/>
    <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10002B"/>
    <stop offset="1" stop-color="#10002B" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="vig" cx=".5" cy=".45" r=".8">
    <stop offset=".6" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#05010D" stop-opacity=".5"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="tapeclip"><rect x="-60" y="152" width="1120" height="60"/></clipPath>
</defs>
<style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  .tw2{animation:tw 4.3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
  .grid line{animation:gp 4.5s ease-in-out infinite}
  @keyframes gp{0%,100%{opacity:.14}50%{opacity:.3}}
  .stripes{animation:st 1.1s linear infinite}
  @keyframes st{to{transform:translateX(-52px)}}
  .marq{animation:mq 16s linear infinite}
  @keyframes mq{to{transform:translateX(-1120px)}}
  .gc{animation:gc 5.2s steps(1,end) infinite}
  @keyframes gc{0%,84%,94%,100%{transform:translate(0,0)}86%{transform:translate(-3px,1px)}88%{transform:translate(2px,-1px)}91%{transform:translate(-1px,0)}}
  .gm{animation:gm 5.2s steps(1,end) infinite}
  @keyframes gm{0%,84%,94%,100%{transform:translate(0,0)}86%{transform:translate(3px,-1px)}88%{transform:translate(-2px,1px)}91%{transform:translate(1px,0)}}
  .gmain{animation:gx 5.2s steps(1,end) infinite}
  @keyframes gx{0%,85%,93%,100%{opacity:1}87%{opacity:.8}90%{opacity:.95}}
  .scanline{animation:sl 6.5s linear infinite}
  @keyframes sl{from{transform:translateY(-60px)}to{transform:translateY(340px)}}
  .pulse{animation:pu 1.6s ease-in-out infinite}
  @keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
  .rec{animation:pu 1.1s steps(2,start) infinite}
</style>

<rect width="1000" height="320" fill="url(#bg)"/>

<!-- perspective grid floor -->
<g class="grid" stroke="#7B2FF7" stroke-width="1">
  <line x1="500" y1="208" x2="-140" y2="320"/>
  <line x1="500" y1="208" x2="20" y2="320"/>
  <line x1="500" y1="208" x2="180" y2="320"/>
  <line x1="500" y1="208" x2="340" y2="320"/>
  <line x1="500" y1="208" x2="500" y2="320"/>
  <line x1="500" y1="208" x2="660" y2="320"/>
  <line x1="500" y1="208" x2="820" y2="320"/>
  <line x1="500" y1="208" x2="980" y2="320"/>
  <line x1="500" y1="208" x2="1140" y2="320"/>
  <line x1="0" y1="214" x2="1000" y2="214"/>
  <line x1="0" y1="221" x2="1000" y2="221"/>
  <line x1="0" y1="231" x2="1000" y2="231"/>
  <line x1="0" y1="244" x2="1000" y2="244"/>
  <line x1="0" y1="261" x2="1000" y2="261"/>
  <line x1="0" y1="283" x2="1000" y2="283"/>
  <line x1="0" y1="309" x2="1000" y2="309"/>
</g>
<rect x="0" y="206" width="1000" height="34" fill="url(#fadeGrid)"/>

<!-- particles -->
<g>
  <circle cx="88" cy="62" r="1.6" fill="#00E5FF" class="tw"/>
  <circle cx="204" cy="44" r="1.2" fill="#F72585" class="tw2" style="animation-delay:-1.2s"/>
  <circle cx="318" cy="72" r="1.4" fill="#EDEDF7" class="tw" style="animation-delay:-2.1s"/>
  <circle cx="452" cy="38" r="1.2" fill="#00E5FF" class="tw2" style="animation-delay:-.6s"/>
  <circle cx="588" cy="66" r="1.6" fill="#F72585" class="tw" style="animation-delay:-2.8s"/>
  <circle cx="704" cy="42" r="1.2" fill="#EDEDF7" class="tw2" style="animation-delay:-1.7s"/>
  <circle cx="836" cy="70" r="1.5" fill="#00E5FF" class="tw" style="animation-delay:-.9s"/>
  <circle cx="934" cy="52" r="1.2" fill="#F72585" class="tw2" style="animation-delay:-3.2s"/>
  <circle cx="140" cy="118" r="1.2" fill="#A957FF" class="tw" style="animation-delay:-1.5s"/>
  <circle cx="866" cy="120" r="1.2" fill="#A957FF" class="tw2" style="animation-delay:-2.4s"/>
  <text x="256" y="120" class="mono tw2" font-size="11" fill="#00E5FF" style="animation-delay:-.4s">+</text>
  <text x="748" y="96" class="mono tw" font-size="11" fill="#F72585" style="animation-delay:-1.9s">+</text>
  <text x="62" y="164" class="mono tw2" font-size="10" fill="#A957FF" style="animation-delay:-2.6s">+</text>
</g>

<!-- hazard tape band -->
<g transform="rotate(-3 500 182)">
  <g clip-path="url(#tapeclip)">
    <rect x="-60" y="152" width="1120" height="60" fill="#140632" opacity=".88"/>
    <g transform="translate(0 0) skewX(-25)">
      <g class="stripes" fill="#F72585" opacity=".14">
        <rect x="-120" y="140" width="26" height="84"/><rect x="-68" y="140" width="26" height="84"/>
        <rect x="-16" y="140" width="26" height="84"/><rect x="36" y="140" width="26" height="84"/>
        <rect x="88" y="140" width="26" height="84"/><rect x="140" y="140" width="26" height="84"/>
        <rect x="192" y="140" width="26" height="84"/><rect x="244" y="140" width="26" height="84"/>
        <rect x="296" y="140" width="26" height="84"/><rect x="348" y="140" width="26" height="84"/>
        <rect x="400" y="140" width="26" height="84"/><rect x="452" y="140" width="26" height="84"/>
        <rect x="504" y="140" width="26" height="84"/><rect x="556" y="140" width="26" height="84"/>
        <rect x="608" y="140" width="26" height="84"/><rect x="660" y="140" width="26" height="84"/>
        <rect x="712" y="140" width="26" height="84"/><rect x="764" y="140" width="26" height="84"/>
        <rect x="816" y="140" width="26" height="84"/><rect x="868" y="140" width="26" height="84"/>
        <rect x="920" y="140" width="26" height="84"/><rect x="972" y="140" width="26" height="84"/>
        <rect x="1024" y="140" width="26" height="84"/><rect x="1076" y="140" width="26" height="84"/>
        <rect x="1128" y="140" width="26" height="84"/><rect x="1180" y="140" width="26" height="84"/>
      </g>
    </g>
    <g class="marq">
      <text x="0" y="207" textLength="1120" class="mono" font-size="11" letter-spacing="2" fill="#F9F871" opacity=".4">⚠ CAUTION // HOLLOW ACTIVITY DETECTED // PROXY CLEARANCE REQUIRED // SIGNAL LOCKED ⚠ CAUTION // HOLLOW ACTIVITY DETECTED //</text>
      <text x="1120" y="207" textLength="1120" class="mono" font-size="11" letter-spacing="2" fill="#F9F871" opacity=".4">⚠ CAUTION // HOLLOW ACTIVITY DETECTED // PROXY CLEARANCE REQUIRED // SIGNAL LOCKED ⚠ CAUTION // HOLLOW ACTIVITY DETECTED //</text>
    </g>
  </g>
  <line x1="-60" y1="153" x2="1060" y2="153" stroke="#F72585" stroke-width="1.5" opacity=".55"/>
  <line x1="-60" y1="211" x2="1060" y2="211" stroke="#F72585" stroke-width="1.5" opacity=".55"/>
</g>

<!-- glitch title -->
<g text-anchor="middle" class="sans" font-weight="900" font-size="62" letter-spacing="6">
  <text x="500" y="196" textLength="760" lengthAdjust="spacingAndGlyphs" fill="none" stroke="url(#tg)" stroke-width="1.5" opacity=".55" filter="url(#glow)">SPYROS STAVRAKIS</text>
  <text x="500" y="196" textLength="760" lengthAdjust="spacingAndGlyphs" fill="#00E5FF" opacity=".75" class="gc">SPYROS STAVRAKIS</text>
  <text x="500" y="196" textLength="760" lengthAdjust="spacingAndGlyphs" fill="#F72585" opacity=".75" class="gm">SPYROS STAVRAKIS</text>
  <text x="500" y="196" textLength="760" lengthAdjust="spacingAndGlyphs" fill="#EDEDF7" class="gmain">SPYROS STAVRAKIS</text>
</g>

<!-- subtitle -->
<line x1="66" y1="242" x2="352" y2="242" stroke="#7B2FF7" stroke-width="1" opacity=".55"/>
<line x1="648" y1="242" x2="934" y2="242" stroke="#7B2FF7" stroke-width="1" opacity=".55"/>
<text x="500" y="247" text-anchor="middle" textLength="560" lengthAdjust="spacingAndGlyphs" class="mono" font-size="14" letter-spacing="4" fill="#9D9DBD">DATA SCIENCE ▸ MACHINE LEARNING ▸ NEW ERIDU</text>

<!-- HUD corners -->
<g stroke="#00E5FF" stroke-width="2" fill="none" opacity=".65">
  <path d="M8 36 V8 H36"/>
  <path d="M964 8 H992 V36"/>
  <path d="M8 284 V312 H36"/>
  <path d="M992 284 V312 H964"/>
</g>

<!-- status chips -->
<circle cx="52" cy="24" r="3.5" fill="#F9F871" class="pulse"/>
<text x="63" y="28" class="mono" font-size="12" letter-spacing="2" fill="#F9F871">SYS.ONLINE</text>
<circle cx="790" cy="24" r="4" fill="#FF2E63" class="rec"/>
<text x="801" y="28" class="mono" font-size="12" letter-spacing="1" fill="#EDEDF7">REC</text>
<text x="948" y="28" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#6E6E92">LOC: NEW ERIDU</text>

<!-- scanline + vignette -->
<rect x="0" y="0" width="1000" height="56" fill="url(#scan)" class="scanline"/>
<rect width="1000" height="320" fill="url(#vig)"/>
</svg>
