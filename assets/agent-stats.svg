<text x="40" y="210" class="mono" font-size="14" fill="#B9B9D4">SQL · DATA ENG</text>
<rect x="250" y="198" width="560" height="14" rx="7" fill="#1A0B3D" stroke="#7B2FF7" stroke-opacity=".3"/>
<rect x="250" y="198" width="560" height="14" rx="7" fill="url(#fill)" class="bar b4"/>
<g clip-path="url(#c4)"><rect x="250" y="198" width="70" height="14" fill="url(#sh)" class="shm" style="animation-delay:2.55s"/></g>
<text x="838" y="210" text-anchor="end" class="mono" font-weight="bold" font-size="14" fill="#EDEDF7">86</text>
<rect x="852" y="195" width="40" height="20" rx="4" fill="#00E5FF" class="chip" style="animation-delay:1.61s"/>
<text x="872" y="209" text-anchor="middle" class="sans" font-weight="900" font-size="13" fill="#0D0221"><tspan class="fx" style="animation-delay:1.66s">A</tspan></text>

<!-- row 5 : ONNX · EDGE AI 84 A -->
<text x="40" y="248" class="mono" font-size="14" fill="#B9B9D4">ONNX · EDGE AI</text>
<rect x="250" y="236" width="560" height="14" rx="7" fill="#1A0B3D" stroke="#7B2FF7" stroke-opacity=".3"/>
<rect x="250" y="236" width="560" height="14" rx="7" fill="url(#fill)" class="bar b5"/>
<g clip-path="url(#c5)"><rect x="250" y="236" width="70" height="14" fill="url(#sh)" class="shm" style="animation-delay:2.9s"/></g>
<text x="838" y="248" text-anchor="end" class="mono" font-weight="bold" font-size="14" fill="#EDEDF7">84</text>
<rect x="852" y="233" width="40" height="20" rx="4" fill="#00E5FF" class="chip" style="animation-delay:1.73s"/>
<text x="872" y="247" text-anchor="middle" class="sans" font-weight="900" font-size="13" fill="#0D0221"><tspan class="fx" style="animation-delay:1.78s">A</tspan></text>

