<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img">
<title>Agent combat stats — skill levels</title>
<defs>
  <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF"/>
    <stop offset=".55" stop-color="#A957FF"/>
    <stop offset="1" stop-color="#F72585"/>
  </linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".35"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c1"><rect x="250" y="84" width="526" height="14" rx="7"/></clipPath>
  <clipPath id="c2"><rect x="250" y="122" width="504" height="14" rx="7"/></clipPath>
  <clipPath id="c3"><rect x="250" y="160" width="493" height="14" rx="7"/></clipPath>
  <clipPath id="c4"><rect x="250" y="198" width="482" height="14" rx="7"/></clipPath>
  <clipPath id="c5"><rect x="250" y="236" width="470" height="14" rx="7"/></clipPath>
  <clipPath id="c6"><rect x="250" y="274" width="426" height="14" rx="7"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}
  .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .shm{animation:shm 3s ease-in-out infinite}
  @keyframes shm{0%{transform:translateX(-90px)}45%,100%{transform:translateX(620px)}}
</style>

<rect x="6" y="6" width="988" height="348" rx="12" fill="#0F0526" stroke="#7B2FF7" stroke-opacity=".45" stroke-width="1.5"/>

<rect x="36" y="26" width="6" height="20" fill="#F72585"/>
<rect x="48" y="26" width="6" height="20" fill="#00E5FF"/>
<text x="66" y="43" class="sans" font-weight="800" font-size="20" letter-spacing="3" fill="#EDEDF7">AGENT COMBAT STATS</text>
<text x="956" y="42" text-anchor="end" class="mono" font-size="13" letter-spacing="1" fill="#9494B8">SYNC 100% ▸ DATA DIVISION</text>

<g stroke="#7B2FF7" opacity=".12">
  <line x1="250" y1="70" x2="250" y2="296"/>
  <line x1="390" y1="70" x2="390" y2="296"/>
  <line x1="530" y1="70" x2="530" y2="296"/>
  <line x1="670" y1="70" x2="670" y2="296"/>
  <line x1="810" y1="70" x2="810" y2="296"/>
