<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="54" viewBox="0 0 1000 54" role="img">
<title>PROXY // DATA AND ML ENGINEER</title>
<style>
  .mono{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}
  .q1{animation:cy 16s steps(1,end) infinite}
  .q2{animation:cy 16s steps(1,end) infinite;animation-delay:-12s}
  .q3{animation:cy 16s steps(1,end) infinite;animation-delay:-8s}
  .q4{animation:cy 16s steps(1,end) infinite;animation-delay:-4s}
  @keyframes cy{0%,24%{opacity:1}25%,100%{opacity:0}}
  .cur{animation:bl 1s steps(2,start) infinite}
  @keyframes bl{50%{opacity:0}}
  .tick{animation:pu 2.2s ease-in-out infinite}
  @keyframes pu{0%,100%{opacity:.85}50%{opacity:.25}}
</style>
<rect x="140" y="26" width="8" height="2.5" fill="#F72585" class="tick"/>
<rect x="852" y="26" width="8" height="2.5" fill="#F72585" class="tick" style="animation-delay:-1.1s"/>
<g text-anchor="middle" class="mono" font-size="18" letter-spacing="3">
  <text x="500" y="34" class="q1" fill="#00E5FF">PROXY // DATA &amp; ML ENGINEER <tspan fill="#F72585" class="cur">▊</tspan></text>
  <text x="500" y="34" class="q2" fill="#00E5FF">SIGNAL &gt; NOISE <tspan fill="#F72585" class="cur">▊</tspan></text>
  <text x="500" y="34" class="q3" fill="#00E5FF">TRAINING MODELS IN THE VOID <tspan fill="#F72585" class="cur">▊</tspan></text>
  <text x="500" y="34" class="q4" fill="#00E5FF">ZENLESS ZONE ZERO ENJOYER <tspan fill="#F72585" class="cur">▊</tspan></text>
</g>
</svg>
