<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img">
<title>Agent combat stats — skill levels</title>
<defs>
  <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF"/>
    <stop offset=".55" stop-color="#A957FF"/>
    <stop offset="1" stop-color="#F72585"/>
  </linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".35"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c1"><rect x="250" y="84" width="526" height="14" rx="7"/></clipPath>
  <clipPath id="c2"><rect x="250" y="122" width="504" height="14" rx="7"/></clipPath>
  <clipPath id="c3"><rect x="250" y="160" width="493" height="14" rx="7"/></clipPath>
  <clipPath id="c4"><rect x="250" y="198" width="482" height="14" rx="7"/></clipPath>
  <clipPath id="c5"><rect x="250" y="236" width="470" height="14" rx="7"/></clipPath>
  <clipPath id="c6"><rect x="250" y="274" width="426" height="14" rx="7"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}
  .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .bar{transform-box:fill-box;transform-origin:left center}
  .b1{animation:w1 1s cubic-bezier(.2,.9,.3,1) .25s both}
  .b2{animation:w2 1s cubic-bezier(.2,.9,.3,1) .37s both}
  .b3{animation:w3 1s cubic-bezier(.2,.9,.3,1) .49s both}
  .b4{animation:w4 1s cubic-bezier(.2,.9,.3,1) .61s both}
  .b5{animation:w5 1s cubic-bezier(.2,.9,.3,1) .73s both}
  .b6{animation:w6 1s cubic-bezier(.2,.9,.3,1) .85s both}
  @keyframes w1{from{transform:scaleX(0)}to{transform:scaleX(.94)}}
  @keyframes w2{from{transform:scaleX(0)}to{transform:scaleX(.90)}}
  @keyframes w3{from{transform:scaleX(0)}to{transform:scaleX(.88)}}
  @keyframes w4{from{transform:scaleX(0)}to{transform:scaleX(.86)}}
  @keyframes w5{from{transform:scaleX(0)}to{transform:scaleX(.84)}}
  @keyframes w6{from{transform:scaleX(0)}to{transform:scaleX(.76)}}
  .shm{animation:shm 3s ease-in-out infinite}
  @keyframes shm{0%{transform:translateX(-90px)}45%,100%{transform:translateX(620px)}}
  .chip{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .fx{opacity:0;animation:fi .5s ease-out forwards}
  @keyframes fi{to{opacity:1}}
</style>

<rect x="6" y="6" width="988" height="348" rx="12" fill="#0F0526" stroke="#7B2FF7" stroke-opacity=".45" stroke-width="1.5"/>

<rect x="36" y="26" width="6" height="20" fill="#F72585"/>
<rect x="48" y="26" width="6" height="20" fill="#00E5FF"/>
<text x="66" y="43" class="sans" font-weight="800" font-size="20" letter-spacing="3" fill="#EDEDF7">AGENT COMBAT STATS</text>
<text x="956" y="42" text-anchor="end" class="mono" font-size="12" letter-spacing="1" fill="#6E6E92">SYNC 100% ▸ DATA DIVISION</text>

<g stroke="#7B2FF7" opacity=".12">
  <line x1="250" y1="70" x2="250" y2="296"/>
  <line x1="390" y1="70" x2="390" y2="296"/>
  <line x1="530" y1="70" x2="530" y2="296"/>
  <line x1="670" y1="70" x2="670" y2="296"/>
  <line x1="810" y1="70" x2="810" y2="296"/>
</g>

<!-- row 1 : PYTHON 94 S -->
<text x="40" y="96" class="mono" font-size="14" fill="#B9B9D4">PYTHON</text>
<rect x="250" y="84" width="560" height="14" rx="7" fill="#1A0B3D" stroke="#7B2FF7" stroke-opacity=".3"/>
<rect x="250" y="84" width="560" height="14" rx="7" fill="url(#fill)" class="bar b1"/>
<g clip-path="url(#c1)"><rect x="250" y="84" width="70" height="14" fill="url(#sh)" class="shm" style="animation-delay:1.5s"/></g>
<text x="838" y="96" text-anchor="end" class="mono" font-weight="bold" font-size="14" fill="#EDEDF7">94</text>
<rect x="852" y="81" width="40" height="20" rx="4" fill="#F72585" class="chip" style="animation-delay:1.25s"/>
<text x="872" y="95" text-anchor="middle" class="sans" font-weight="900" font-size="13" fill="#0D0221"><tspan class="fx" style="animation-delay:1.3s">S</tspan></text>

