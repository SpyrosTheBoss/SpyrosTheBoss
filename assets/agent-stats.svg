<g clip-path="url(#c2)"><rect x="250" y="122" width="70" height="14" fill="url(#sh)" class="shm" style="animation-delay:1.85s"/></g>
<text x="838" y="134" text-anchor="end" class="mono" font-weight="bold" font-size="14" fill="#EDEDF7">90</text>
