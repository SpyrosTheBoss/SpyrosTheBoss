<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img">
<title>05 // UPLINK</title>
<defs>
  <linearGradient id="rl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF2E63"/>
    <stop offset="1" stop-color="#FF2E63" stop-opacity="0"/>
  </linearGradient>
  <filter id="g3" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .mono{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}
  .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .dot{animation:dt 3.4s ease-in-out infinite alternate}
  @keyframes dt{from{transform:translateX(0)}to{transform:translateX(500px)}}
</style>
<rect width="900" height="64" rx="12" fill="#0D0221"/>
<rect x=".75" y=".75" width="898.5" height="62.5" rx="11.5" fill="none" stroke="#FF2E63" stroke-opacity=".25" stroke-width="1.5"/>
<g class="in">
  <rect x="14" y="15" width="54" height="34" rx="8" fill="#FF2E63" fill-opacity=".12" stroke="#FF2E63" stroke-width="1.5"/>
  <text x="41" y="38" text-anchor="middle" class="mono" font-weight="bold" font-size="17" fill="#FF2E63">05</text>
  <text x="82" y="38" class="mono" font-size="16" fill="#4E4E6E">//</text>
  <text x="112" y="40" class="sans" font-weight="900" font-size="23" letter-spacing="4" fill="#EDEDF7">UPLINK</text>
  <line x1="300" y1="32" x2="810" y2="32" stroke="url(#rl)" stroke-width="1.5"/>
  <circle cx="306" cy="32" r="3.5" fill="#FF2E63" filter="url(#g3)" class="dot"/>
  <text x="886" y="37" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#6E6E92">[ CHANNEL // OPEN ]</text>
