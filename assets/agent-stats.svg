<line x1="36" y1="312" x2="964" y2="312" stroke="#7B2FF7" opacity=".2"/>
<text x="40" y="336" class="mono" font-size="12" fill="#6E6E92">W-ENGINE: Jupyter Mk.IV · DRIVE DISCS: [Curiosity ×4] [Caffeine ×2] · PASSIVE: +30% pattern recognition</text>
